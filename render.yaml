# One free Render web service: builds the React site and serves it together with the API.
services:
  - type: web
    name: step12
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # paste your key in the Render dashboard when asked
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false # free backup AI (console.groq.com)
      - key: OPENROUTER_API_KEY
        sync: false # free backup AI (openrouter.ai)
